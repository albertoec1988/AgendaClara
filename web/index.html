<!doctype html>
<html lang="es">
<head>

  <meta name="theme-color" content="#173d37"><title>Mi semana · ClearDebt</title>
  <link rel="icon" type="image/svg+xml" href="./brand.svg"><link rel="stylesheet" href="./styles.css">
</head>
<body>
